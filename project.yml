# Generate Reach.xcodeproj with:  xcodegen generate
name: Reach
options:
  bundleIdPrefix: com.example.reach   # change to your own reverse-DNS prefix before signing
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en

settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""   # set your team in Xcode (Signing & Capabilities)

packages:
  ReachCore:
    path: ReachCore

targets:
  Reach:
    type: application
    platform: iOS
    sources:
      - path: Reach
        excludes:
          - "Simulation/**"
          - "Resources/Info.plist"   # used via INFOPLIST_FILE, not copied as a resource
      - path: Reach/Simulation
        buildPhase: none
    dependencies:
      - package: ReachCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.reach.app
        INFOPLIST_FILE: Reach/Resources/Info.plist
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: YES

schemes:
  Reach:
    build:
      targets:
        Reach: all
    run:
      config: Debug
      simulateLocation:
        allow: true
        defaultLocation: Reach/Simulation/WalkBarclaysToGrandArmyPlaza.gpx
    archive:
      config: Release
